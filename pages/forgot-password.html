<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Reset your I-Tech Solutions account password">

    <title>Forgot Password | I-Tech Solutions</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<!-- =====================================================
     TECHNOLOGY BACKGROUND
===================================================== -->

<div class="tech-background">

    <div class="grid-lines"></div>

    <div class="glow glow-1"></div>

    <div class="glow glow-2"></div>

    <div class="particles"></div>

</div>



<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="container nav-container">


        <!-- LOGO -->

        <a href="../index.html"
           class="logo">

            <div class="logo-3d">
             <img src="images/I-Tech_fass-removebg-preview.png" alt="I-Tech Solutions Logo" class="logo-3d">
    
            </div>

            <div class="logo-text">

                <strong>I-Tech</strong>

                <small>
                    Solutions
                </small>

            </div>

        </a>



        <!-- NAVIGATION -->

        <nav class="navbar">

            <a href="../index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cyber-security.html">
                Cyber Security
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>



        <!-- AUTH -->

        <div class="auth-buttons">

            <a href="login.html"
               class="login-btn">

                Login

            </a>

            <a href="signup.html"
               class="signup-btn">

                Sign Up

            </a>

        </div>



        <!-- MOBILE MENU -->

        <button class="menu-toggle"
                id="menuToggle">

            ☰

        </button>

    </div>

</header>



<!-- =====================================================
     FORGOT PASSWORD
===================================================== -->

<main>

<section style="
min-height:calc(100vh - 90px);
display:flex;
align-items:center;
justify-content:center;
padding:80px 20px;
">


    <div style="
    width:100%;
    max-width:520px;
    ">


        <!-- =================================================
             CARD
        ================================================= -->

        <div style="
        padding:45px;
        border-radius:24px;
        border:1px solid rgba(0,217,255,.20);
        background:rgba(10,15,30,.78);
        backdrop-filter:blur(18px);
        -webkit-backdrop-filter:blur(18px);
        box-shadow:0 25px 80px rgba(0,0,0,.35);
        ">


            <!-- LOGO -->

            <div style="
            text-align:center;
            margin-bottom:25px;
            ">

                <div class="logo-3d"
                     style="
                     justify-content:center;
                     font-size:40px;
                     ">

                    <span>I</span>
                    <span>-</span>
                    <span>T</span>

                </div>

            </div>



            <!-- HEADING -->

            <div class="section-heading"
                 style="
                 margin-bottom:30px;
                 text-align:center;
                 ">

                <span>
                    ACCOUNT RECOVERY
                </span>

                <h2>

                    Forgot
                    <strong>Password?</strong>

                </h2>

                <p>

                    Enter the email address associated
                    with your account.

                </p>

            </div>



            <!-- =================================================
                 FORM
            ================================================= -->

            <form id="forgotPasswordForm">


                <div class="form-group">

                    <label for="recoveryEmail">

                        Email Address

                    </label>

                    <input
                        type="email"
                        id="recoveryEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required>

                </div>



                <button
                    type="submit"
                    class="primary-btn"
                    style="
                    width:100%;
                    justify-content:center;
                    ">

                    Send Recovery Link →

                </button>


            </form>



            <!-- MESSAGE -->

            <div id="recoveryMessage"
                 style="
                 display:none;
                 margin-top:20px;
                 padding:15px;
                 border-radius:12px;
                 border:1px solid rgba(0,217,255,.2);
                 background:rgba(0,217,255,.05);
                 color:#9ca8c7;
                 line-height:1.6;
                 ">

            </div>



            <!-- BACK TO LOGIN -->

            <div style="
            text-align:center;
            margin-top:28px;
            ">

                <a href="login.html"
                   style="
                   color:#00d9ff;
                   font-weight:600;
                   ">

                    ← Back to Login

                </a>

            </div>


        </div>

    </div>

</section>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <div class="footer-bottom">

        <p>

            ©
            <span id="currentYear"></span>

            I-Tech Solutions.
            All Rights Reserved.

        </p>

    </div>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="../js/script.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const form =
            document.getElementById(
                "forgotPasswordForm"
            );


        const message =
            document.getElementById(
                "recoveryMessage"
            );


        if (form) {

            form.addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();


                    const email =
                        document.getElementById(
                            "recoveryEmail"
                        ).value.trim();


                    if (!email) {

                        return;

                    }


                    message.style.display =
                        "block";


                    message.textContent =
                        "If an account exists with this email, recovery instructions would be sent there.";

                    form.reset();

                }
            );

        }

    }
);

</script>


</body>

</html>
